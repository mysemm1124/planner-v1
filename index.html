<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fadbd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Me.Plan">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>try{var t=localStorage.getItem("planner-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>Me.Plan</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="rose"]{
  --bg:#fadbd8; --paper:#fff8f7; --ink:#3a2321; --ink2:#6b4a46; --muted:#a67f7a; --line:#f2cfca; --soft:#f6d2ce;
  --accent:#c95467; --on-accent:#fff; --accent-soft:#fbe4e1; --sun:#c8394a; --sat:#4a64b8; --warn:#b85a2c;
  --cell-out:#fdefed; --hover:#fff1ef; --today-row:#fff0ee; --chk:#e3aca5; --badge:#fbe2d6; --input:#fff; --overlay:rgba(70,30,28,.3);
  --r:12px;
}
[data-theme="white"]{
  --bg:#ffffff; --paper:#ffffff; --ink:#1d1d1f; --ink2:#48484a; --muted:#8e8e93; --line:#e3e3e8; --soft:#f2f2f5;
  --accent:#2c2c2e; --on-accent:#fff; --accent-soft:#efeff2; --sun:#d0393f; --sat:#3460c4; --warn:#b5651d;
  --cell-out:#fafafa; --hover:#f6f6f8; --today-row:#f7f7f9; --chk:#c7c7cc; --badge:#f6ece2; --input:#fff; --overlay:rgba(0,0,0,.25);
}
[data-theme="black"]{
  --bg:#000000; --paper:#121212; --ink:#f2f2f2; --ink2:#c9c9c9; --muted:#8a8a8a; --line:#2a2a2a; --soft:#1f1f1f;
  --accent:#ededed; --on-accent:#000; --accent-soft:#262626; --sun:#ff6b6b; --sat:#7aa2ff; --warn:#f0a35e;
  --cell-out:#0a0a0a; --hover:#1b1b1b; --today-row:#181818; --chk:#555; --badge:#33261a; --input:#1a1a1a; --overlay:rgba(0,0,0,.6);
}
[data-theme="sky"]{
  --bg:#bbcbd2; --paper:#f6f9fa; --ink:#1e2a30; --ink2:#44555d; --muted:#72858d; --line:#c6d4da; --soft:#d0dde2;
  --accent:#3f6878; --on-accent:#fff; --accent-soft:#e1eaee; --sun:#c0454a; --sat:#3a5fae; --warn:#a8662a;
  --cell-out:#edf2f4; --hover:#eff4f6; --today-row:#ecf2f5; --chk:#a3b9c2; --badge:#f1e5d5; --input:#fff; --overlay:rgba(20,40,50,.3);
}
[data-theme="butter"]{
  --bg:#fad892; --paper:#fffbf1; --ink:#3a2c12; --ink2:#6a5733; --muted:#a08c62; --line:#f0d9a2; --soft:#f5dfa8;
  --accent:#b5742a; --on-accent:#fff; --accent-soft:#fcefd0; --sun:#c4473a; --sat:#4a64b8; --warn:#a65a1f;
  --cell-out:#fdf3dc; --hover:#fff5de; --today-row:#fff3d8; --chk:#ddbb76; --badge:#f8e1c6; --input:#fff; --overlay:rgba(60,40,10,.3);
}
[data-theme="navy"]{
  --bg:#081a2e; --paper:#0f2540; --ink:#e8eef6; --ink2:#b8c6d6; --muted:#7f93aa; --line:#1e3854; --soft:#17304d;
  --accent:#7fb2e5; --on-accent:#081a2e; --accent-soft:#183656; --sun:#ff8a80; --sat:#8fb4ff; --warn:#f2b066;
  --cell-out:#0b2038; --hover:#15304f; --today-row:#122c4a; --chk:#3d5a7a; --badge:#3a3020; --input:#0b2038; --overlay:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand .today{color:var(--muted);font-size:13px;margin-top:2px}
.status{font-size:12px;color:var(--muted)}
.status.warn{color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;background:var(--soft);padding:4px;border-radius:999px}
nav.tabs a{padding:7px 16px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs a.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h2{margin:0 6px 0 0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{background:var(--soft)}
.btn.icon{padding:6px 10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--sun);border-color:#ecc9c5}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.spacer{flex:1}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* month */
.month-layout{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.month-layout .sects{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.month-layout .sects{grid-template-columns:1fr;gap:0}}
.cal{overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-head div{padding:8px;font-size:12px;font-weight:600;color:var(--muted);text-align:left;border-bottom:1px solid var(--line)}
.cal-head div.sun{color:var(--sun)} .cal-head div.sat{color:var(--sat)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 6px;cursor:pointer;position:relative;background:var(--paper);display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--cell-out)}
.cell.out .num{opacity:.4}
.cell:hover{background:var(--hover)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
.cell.is-today .num{background:var(--accent);color:var(--on-accent)}
.chip{font-size:11.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;line-height:1.5}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.tcount{position:absolute;top:7px;right:7px;font-size:10.5px;color:var(--muted);font-weight:500}
.tcount.all{color:var(--accent)}
@media (max-width:600px){
  .cell{min-height:62px;padding:3px}
  .chip{font-size:0;height:5px;padding:0;border-radius:3px}
  .more{display:none}
  .tcount{display:none}
}
.panel{padding:16px}
.panel h3{margin:0 0 2px;font-size:17px}
.sect{margin-top:14px}
.sect-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* lists */
ul.list{list-style:none;margin:0;padding:0}
.ev{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.ev:hover{background:var(--soft)}
.ev .dot{width:9px;height:9px;border-radius:50%;flex:none}
.ev .time{font-size:12.5px;color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
.ev .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .range{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none}
.task{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px}
.task:hover{background:var(--hover)}
.chk{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--chk);background:var(--paper);flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.chk{color:var(--on-accent)}
.chk svg{width:13px;height:13px;opacity:0}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .chk{color:var(--on-accent)}
.chk svg{opacity:1}
.task .ttl{flex:1;min-width:0;cursor:pointer;word-break:break-word}
.task.done .ttl{color:var(--muted);text-decoration:line-through}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--badge);color:var(--warn);white-space:nowrap;font-weight:500}
.badge.g{background:var(--accent-soft);color:var(--accent)}
.badge.n{background:var(--soft);color:var(--ink2)}
.mini{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.mini:hover{background:var(--soft);color:var(--ink)}
.task .mini{opacity:0}
.task:hover .mini,.task:focus-within .mini{opacity:1}
@media (hover:none){.task .mini{opacity:1}}
form.add{display:flex;gap:6px;margin-top:6px}
form.add input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 10px;outline:none}
form.add input:focus{border-style:solid;border-color:var(--accent);background:var(--paper)}
form.add select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 6px}

/* week */
.week{display:flex;flex-direction:column}
.wday{display:grid;grid-template-columns:110px 1fr 1fr;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.wday:last-child{border-bottom:0}
.wday.is-today{background:var(--today-row)}
.wdate{display:flex;flex-direction:column;cursor:pointer}
.wdate .d{font-size:22px;font-weight:600;line-height:1.1}
.wdate .w{font-size:12px;color:var(--muted)}
.wday.sun .wdate .d,.wday.sun .wdate .w{color:var(--sun)}
.wday.sat .wdate .d,.wday.sat .wdate .w{color:var(--sat)}
.wday.is-today .wdate .w::after{content:" · 오늘";color:var(--accent);font-weight:600}
.wcol-title{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
@media (max-width:760px){.wday{grid-template-columns:1fr;gap:6px}.wdate{flex-direction:row;align-items:baseline;gap:8px}}

/* today */
.day-wrap{max-width:720px}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.prog-txt{font-size:12.5px;color:var(--muted)}

/* checklist */
.ck-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:860px){.ck-layout{grid-template-columns:1fr}}
.group-label{font-size:12px;color:var(--ink2);font-weight:600;margin:12px 0 2px;padding-left:4px}
details.rest summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:14px}

/* timetable */
.tt-wrap{overflow-x:auto}
.tt{display:grid;position:relative;min-width:520px}
.tt-head{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tt-hours{position:relative;border-right:1px solid var(--line)}
.tt-hour{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-1px)}
.tt-col{position:relative;border-right:1px solid var(--line);cursor:pointer}
.tt-col:last-child{border-right:0}
.tt-line{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tt-line.half{border-top-style:dashed;opacity:.5}
.tt-block{position:absolute;left:2px;right:2px;border-radius:6px;padding:4px 5px;overflow:hidden;cursor:pointer;color:#1d1d1f;line-height:1.25}
.tt-block b{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.tt-block span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.tt{min-width:0}.tt-block{padding:3px 3px;left:1px;right:1px}.tt-block b{font-size:10.5px;line-height:1.2}.tt-block span{font-size:9.5px}}
.tt-block span{display:block;font-size:10.5px;opacity:.75}
.tt-col.today{background:var(--today-row)}
.slot-row{display:grid;grid-template-columns:70px 1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.slot-row select,.slot-row input{border:1px solid var(--line);border-radius:8px;padding:7px 6px;background:var(--input);width:100%}
.imp-list{max-height:300px;overflow:auto;margin:6px 0}
.imp-item{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.imp-item input{margin-top:3px}
.ev .cls{white-space:nowrap;flex:none;font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--soft);color:var(--ink2)}
/* past events + celebration */
.ev.past .ttl,.ev.past .time{text-decoration:line-through;color:var(--muted)}
.ev.past .dot{opacity:.45}
.chip.past{opacity:.5;text-decoration:line-through}
.dline.past{text-decoration:line-through;opacity:.55}
.celebrate{text-align:center;padding:28px 16px 22px}
.celebrate .big{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.celebrate .sub{color:var(--muted);font-size:13px}
.celebrate .emo{font-size:34px;margin-bottom:8px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* presets */
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px}
.pchip:hover{background:var(--hover)}
.pchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pcard{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.pcard:last-child{border-bottom:0}
.pcard:hover{background:var(--hover)}
.pcard .sw{width:14px;height:14px;border-radius:50%;flex:none}
.pcard .nm{flex:1;font-weight:500}
/* desk (wallpaper) mode */
html.desk,html.desk body{background:transparent}
.desk-bg{position:fixed;background:var(--bg);z-index:-1;pointer-events:none}
body.desk main{position:relative;isolation:isolate}
body.desk main{max-width:100vw}
body.desk .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column}
body.desk header,body.desk .topline{display:none !important}
html.desk,html.desk body{overflow:hidden;height:100%;margin:0}
body.desk main{flex:1;display:flex;flex-direction:column;min-height:0}
.desk{flex:1;display:flex;flex-direction:column;min-height:0;padding:.9em 1.1em .75em;font-size:var(--dz,16px)}
.desk .btn{font-size:.85em;padding:.3em .7em}
.desk-top{display:flex;align-items:center;gap:.6em;margin-bottom:.5em}
.desk-top h2{margin:0;font-size:1.25em;font-weight:600}
.desk-head,.desk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.desk-head div{text-align:center;font-size:.8em;color:var(--muted);font-weight:600;padding:.25em 0}
.desk-head .sun{color:var(--sun)} .desk-head .sat{color:var(--sat)}
.desk-grid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
.dcell{border-top:1px solid var(--line);padding:.4em .45em;overflow:hidden;cursor:pointer;min-width:0;border-radius:6px}
.dcell:hover{background:var(--hover)}
.dcell .n{font-size:.8em;font-weight:600}
.dcell.out .n{opacity:.4}
.dcell.sun .n{color:var(--sun)} .dcell.sat .n{color:var(--sat)}
.dcell.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.dline{font-size:.78em;line-height:1.35;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline i{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.35em;vertical-align:.08em}
.dline.task{color:var(--ink2)} .dline.task.done{text-decoration:line-through;color:var(--muted)}
/* tabs fill the row on phones */
@media (max-width:760px){
  nav.tabs{width:100%}
  nav.tabs a{flex:1 0 auto;text-align:center;padding:7px 10px}
}
/* mobile fit */
.ck-layout>*,.month-layout>*,.sects>*,.card{min-width:0}
.task .badge{flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){
  .wrap{padding:14px 12px 50px}
  input,select,textarea{font-size:16px !important} /* 아이폰이 입력칸 누를 때 화면 확대하는 것 방지 */
  .task{flex-wrap:wrap;row-gap:3px}
  .task .ttl{flex-basis:calc(100% - 40px)}
  .task .badge{margin-left:29px}
  .task .badge~.badge{margin-left:0}
  .task .mini{margin-left:auto}
  .bar h2{font-size:17px}
}
/* theme picker */
.themes{display:flex;gap:6px;align-items:center}
.themes button{width:18px;height:18px;border-radius:50%;padding:0;border:1px solid rgba(128,128,128,.45)}
.themes button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
input,select,textarea{color:var(--ink)}
html{color-scheme:light}
[data-theme="black"],[data-theme="navy"]{color-scheme:dark}
/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{width:100%;max-width:430px;background:var(--paper);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.2);padding:18px}
.modal h3{margin:0 0 12px;font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--input);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colors{display:flex;gap:8px}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.days{display:flex;gap:5px}
.days button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--input);font-size:13px;padding:0}
.days button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.modal-foot{display:flex;gap:8px;margin-top:16px}
.err{color:var(--sun);font-size:12.5px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Me.Plan</h1>
      <div class="today" id="todayLabel"></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="topline" style="display:flex;gap:8px;align-items:center;margin:-8px 0 12px"><div class="status" id="status">연결하는 중…</div><span class="spacer"></span><div class="themes" id="themes"></div><button class="mini" data-act="tabSettings" title="설정">⚙ 설정</button><button class="mini" data-act="logout">로그아웃</button></div>
  <main id="view"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
"use strict";
/* ---------- utils ---------- */
const WD = ["일","월","화","수","목","금","토"];
const COLORS = ["#c95467","#e8877f","#9d5fb0","#4a64b8","#d98a4a","#6f7d86"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w = (x.getDay()+6)%7; return addDays(x,-w); }; // Monday
const todayStr = () => ymd(new Date());
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtMD = s => { const d = parse(s); return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")"; };
const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

/* ---------- state ---------- */
const S = {
  items: new Map(), col: null, live: false, rolled: false,
  view: "month",
  month: (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
  sel: todayStr(),
  week: startOfWeek(new Date()),
  day: todayStr(),
  today: todayStr(),
};
const all = kind => [...S.items.entries()].filter(([,v]) => v && v.kind === kind).map(([id,v]) => ({id, ...v}));
const eventsOn = ds => all("event").filter(e => e.date <= ds && (e.endDate && e.endDate >= e.date ? e.endDate : e.date) >= ds)
  .sort((a,b) => (a.time||"").localeCompare(b.time||"") || (a.created||0)-(b.created||0));
const tasksOn = ds => all("task").filter(t => t.date === ds)
  .sort((a,b) => (a.done?1:0)-(b.done?1:0) || (a.created||0)-(b.created||0));

/* ---------- persistence ---------- */
const queues = {};
function setStatus(msg, warn){ const el = document.getElementById("status"); el.textContent = msg; el.className = "status" + (warn ? " warn" : ""); }
function handleErr(e){
  console.error(e);
  const c = e && e.code;
  if (c === "quota_exceeded") setStatus("저장 공간이 가득 찼어. 오래된 완료 항목을 정리해줘.", true);
  else if (c === "revoked") setStatus("저장소 접근이 끊겼어. 지금 변경 사항은 저장되지 않아.", true);
  else setStatus("저장 중 문제가 생겼어. 잠시 후 다시 시도해줘.", true);
}
function enqueue(id, fn){
  const prev = queues[id] || Promise.resolve();
  const p = prev.then(fn).catch(async e => {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*800)); try { await fn(); return; } catch(e2){ handleErr(e2); return; } }
    handleErr(e);
  });
  queues[id] = p; return p;
}
function save(id, data){
  const body = JSON.parse(JSON.stringify(data)); delete body.id;
  S.items.set(id, body); render();
  if (S.col) enqueue(id, () => S.col.doc(id).set(body));
}
function removeItem(id){
  S.items.delete(id); render();
  if (S.col) enqueue(id, () => S.col.doc(id).delete());
}

/* ---------- carry-over (4) ---------- */
function rollover(){
  const t = todayStr();
  for (const task of all("task")) {
    if (!task.done && task.date < t) save(task.id, {...task, date: t, origDate: task.origDate || task.date});
  }
}
setInterval(() => {
  const t = todayStr();
  if (t !== S.today) {
    if (S.day === S.today) S.day = t;
    S.today = t;
    if (S.rolled || !S.col) rollover();
    render();
  } else {
    const m = nowKey();
    if (m !== S.lastMinute) { S.lastMinute = m; if (!overlay.classList.contains("open")) render(); }
  }
}, 30000);

/* ---------- routines (5) ---------- */
function periodKey(it, d = new Date()){
  switch (it.repeat) {
    case "daily": case "days": return ymd(d);
    case "weekly": return "W" + ymd(startOfWeek(d));
    case "monthly": return "M" + ymd(d).slice(0,7);
    default: return "once";
  }
}
const isRoutine = it => it.repeat && it.repeat !== "none";
const scheduledOn = (it, d = new Date()) => it.repeat !== "days" || (it.days || []).includes(d.getDay());
const ckDone = it => isRoutine(it) ? it.doneKey === periodKey(it) : !!it.done;
function prevPeriod(it, d){
  if (it.repeat === "weekly") return addDays(d, -7);
  if (it.repeat === "monthly") return new Date(d.getFullYear(), d.getMonth()-1, 1);
  return addDays(d, -1);
}
function streak(it){
  if (!isRoutine(it)) return 0;
  const h = new Set(it.history || []);
  let d = new Date(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (!h.has(periodKey(it, d))) d = prevPeriod(it, d);
  let n = 0;
  for (let i = 0; i < 400; i++) {
    if (it.repeat === "days" && !scheduledOn(it, d)) { d = addDays(d, -1); continue; }
    if (h.has(periodKey(it, d))) { n++; d = prevPeriod(it, d); } else break;
  }
  return n;
}
function repeatLabel(it){
  switch (it.repeat) {
    case "daily": return "매일";
    case "days": return (it.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>WD[i]).join("·") || "요일 미정";
    case "weekly": return "매주";
    case "monthly": return "매월";
    default: return "";
  }
}
function toggleCheck(id){
  const it = {id, ...S.items.get(id)};
  if (!isRoutine(it)) { save(id, {...it, done: !it.done}); return; }
  const k = periodKey(it);
  let h = (it.history || []).filter(x => x !== k);
  if (it.doneKey === k) save(id, {...it, doneKey: null, history: h});
  else { h.push(k); save(id, {...it, doneKey: k, history: h.slice(-400)}); }
}

/* ---------- past check ---------- */
const nowKey = () => { const d = new Date(); return ymd(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function eventPast(e){
  const endD = e.endDate && e.endDate > e.date ? e.endDate : e.date;
  const endT = e.time ? (e.endTime || e.time) : "24:00";
  return endD + " " + endT <= nowKey();
}
const classPast = c => c.ds + " " + c.end <= nowKey();

/* ---------- render pieces ---------- */
function taskRow(t, opts = {}){
  const late = !t.done && t.origDate && t.origDate < t.date ? diffDays(t.date, t.origDate) : 0;
  return `<li class="task ${t.done ? "done" : ""}">
    <button class="chk" data-act="toggleTask" data-id="${t.id}" aria-label="완료 표시">${CHECK_SVG}</button>
    <span class="ttl" data-act="editTask" data-id="${t.id}">${esc(t.title)}</span>
    ${late ? `<span class="badge" title="원래 날짜: ${esc(t.origDate)}">${late}일 이월</span>` : ""}
    ${!t.done && !opts.noTomorrow ? `<button class="mini" data-act="toTomorrow" data-id="${t.id}" title="다음 날로 미루기">다음날 →</button>` : ""}
  </li>`;
}
function eventRow(e, ds){
  const multi = e.endDate && e.endDate > e.date;
  const time = e.time ? e.time + (e.endTime ? "–" + e.endTime : "") : (multi ? "" : "종일");
  return `<li class="ev ${eventPast(e) ? "past" : ""}" data-act="editEvent" data-id="${e.id}">
    <span class="dot" style="background:${esc(e.color||COLORS[0])}"></span>
    ${time ? `<span class="time">${esc(time)}</span>` : ""}
    <span class="ttl">${esc(e.title)}</span>
    ${multi ? `<span class="range">${parse(e.date).getMonth()+1}/${parse(e.date).getDate()}–${parse(e.endDate).getMonth()+1}/${parse(e.endDate).getDate()}</span>` : ""}
  </li>`;
}
const addTaskForm = ds => `<form class="add" data-form="addTask" data-date="${ds}"><input name="t" data-keep="task-${ds}" placeholder="+ 할 일 추가" autocomplete="off"></form>`;

function dayDetail(ds, withHeader = true){
  const evs = eventsOn(ds), ts = tasksOn(ds);
  const done = ts.filter(t => t.done).length;
  return `${withHeader ? `<h3>${fmtMD(ds)}</h3><div class="muted" style="font-size:13px">${ds === S.today ? "오늘" : ""}</div>` : ""}
  <div class="sects"><div class="sect">
    <div class="sect-title">일정 <span class="spacer"></span><button class="mini" data-act="newEvent" data-date="${ds}">+ 일정 추가</button></div>
    ${(() => { const cl = classesOn(ds); return cl.length ? `<ul class="list">${cl.map(classRow).join("")}</ul>` : ""; })()}
    ${evs.length ? `<ul class="list">${evs.map(e => eventRow(e, ds)).join("")}</ul>` : (classesOn(ds).length ? "" : `<div class="empty">일정 없음</div>`)}
  </div>
  <div class="sect">
    <div class="sect-title">할 일 ${ts.length ? `<span class="badge g">${done}/${ts.length}</span>` : ""}</div>
    ${ts.length ? `<ul class="list">${ts.map(t => taskRow(t)).join("")}</ul>` : ""}
    ${addTaskForm(ds)}
    ${presetChips(ds)}
  </div></div>`;
}

/* ---------- views ---------- */
function viewMonth(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const start = startOfWeek(new Date(y, mo, 1));
  const last = new Date(y, mo+1, 0);
  const end = addDays(startOfWeek(last), 6);
  let cells = "";
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    const ds = ymd(d), dow = d.getDay();
    const evs = eventsOn(ds), ts = tasksOn(ds);
    const done = ts.filter(t => t.done).length;
    const cls = ["cell", d.getMonth() !== mo ? "out" : "", dow === 0 ? "sun" : dow === 6 ? "sat" : "", ds === S.today ? "is-today" : "", ds === S.sel ? "sel" : ""].join(" ");
    cells += `<div class="${cls}" data-act="selDate" data-date="${ds}">
      <span class="num">${d.getDate()}</span>
      ${ts.length ? `<span class="tcount ${done === ts.length ? "all" : ""}">✓${done}/${ts.length}</span>` : ""}
      ${evs.slice(0,3).map(e => `<div class="chip ${eventPast(e) ? "past" : ""}" style="background:${esc(e.color||COLORS[0])}">${e.time ? esc(e.time)+" " : ""}${esc(e.title)}</div>`).join("")}
      ${evs.length > 3 ? `<div class="more">+${evs.length-3}</div>` : ""}
    </div>`;
  }
  const head = ["월","화","수","목","금","토","일"].map((w,i) => `<div class="${i===6?"sun":i===5?"sat":""}">${w}</div>`).join("");
  return `<div class="bar">
      <h2>${y}년 ${mo+1}월</h2>
      <button class="btn icon" data-act="monthPrev" aria-label="이전 달">‹</button>
      <button class="btn icon" data-act="monthNext" aria-label="다음 달">›</button>
      <button class="btn" data-act="monthToday">오늘</button>
      <span class="spacer"></span>
      <button class="btn primary" data-act="newEvent" data-date="${S.sel}">+ 일정</button>
    </div>
    <div class="month-layout">
      ${monthPanelOn() ? (celebrateNow() ? celebrateHTML() : `<div class="card panel">${dayDetail(S.sel)}</div>`) : ""}
      <div class="card cal"><div class="cal-head">${head}</div><div class="cal-grid">${cells}</div></div>
    </div>`;
}

function viewWeek(){
  const s = S.week, e = addDays(s, 6);
  const label = `${s.getFullYear()}년 ${s.getMonth()+1}월 ${s.getDate()}일 – ${e.getMonth()+1}월 ${e.getDate()}일`;
  let rows = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(s, i), ds = ymd(d), dow = d.getDay();
    const evs = eventsOn(ds), ts = tasksOn(ds);
    const done = ts.filter(t => t.done).length;
    rows += `<div class="wday ${dow===0?"sun":dow===6?"sat":""} ${ds===S.today?"is-today":""}">
      <div class="wdate" data-act="openDay" data-date="${ds}" title="일간 보기로 열기">
        <span class="d">${d.getDate()}</span><span class="w">${WD[dow]}요일</span>
      </div>
      <div>
        <div class="wcol-title">일정 <button class="mini" data-act="newEvent" data-date="${ds}">+ 일정</button></div>
        ${evs.length ? `<ul class="list">${evs.map(ev => eventRow(ev, ds)).join("")}</ul>` : `<div class="empty">—</div>`}
      </div>
      <div>
        <div class="wcol-title"><span>할 일 ${ts.length ? `<span class="badge g">${done}/${ts.length}</span>` : ""}</span><button class="mini" data-act="weekAdd" data-date="${ds}">${S.weekAdd === ds ? "닫기" : "+ 할 일"}</button></div>
        ${ts.length ? `<ul class="list">${ts.map(t => taskRow(t)).join("")}</ul>` : (S.weekAdd === ds ? "" : `<div class="empty">—</div>`)}
        ${S.weekAdd === ds ? addTaskForm(ds) + presetChips(ds) : ""}
      </div>
    </div>`;
  }
  return `<div class="bar">
      <h2>${label}</h2>
      <button class="btn icon" data-act="weekPrev" aria-label="이전 주">‹</button>
      <button class="btn icon" data-act="weekNext" aria-label="다음 주">›</button>
      <button class="btn" data-act="weekToday">이번 주</button>
    </div>
    <div class="card week">${rows}</div>`;
}

function viewToday(){
  const ds = S.day, ts = tasksOn(ds);
  const done = ts.filter(t => t.done).length;
  const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
  const isPast = ds < S.today;
  return `<div class="day-wrap">
    <div class="bar">
      <h2>${fmtMD(ds)}</h2>
      <button class="btn icon" data-act="dayPrev" aria-label="전날">‹</button>
      <button class="btn icon" data-act="dayNext" aria-label="다음날">›</button>
      <button class="btn" data-act="dayToday">오늘</button>
    </div>
    <div class="card panel">
      ${ts.length ? `<div class="progress"><i style="width:${pct}%"></i></div><div class="prog-txt">${done}/${ts.length} 완료 · ${pct}%</div>` : ""}
      ${isPast ? `<div class="muted" style="font-size:12.5px;margin-top:6px">지난 날짜야. 못 끝낸 할 일은 자동으로 오늘로 옮겨졌어.</div>` : ""}
      ${dayDetail(ds, false)}
    </div>
  </div>`;
}

function ckRow(it){
  const done = ckDone(it), st = streak(it);
  return `<li class="task ${done ? "done" : ""}">
    <button class="chk" data-act="toggleCheck" data-id="${it.id}" aria-label="체크">${CHECK_SVG}</button>
    <span class="ttl" data-act="editCheck" data-id="${it.id}">${esc(it.title)}</span>
    ${it.group ? `<span class="badge n">${esc(it.group)}</span>` : ""}
    ${isRoutine(it) ? `<span class="badge g">${esc(repeatLabel(it))}</span>` : ""}
    ${st >= 2 ? `<span class="badge" title="연속 달성">${st}연속</span>` : ""}
  </li>`;
}
function grouped(list){
  const g = new Map();
  for (const it of list) { const k = it.group || ""; if (!g.has(k)) g.set(k, []); g.get(k).push(it); }
  const keys = [...g.keys()].sort((a,b) => (a===""?-1:b===""?1:a.localeCompare(b,"ko")));
  return keys.map(k => `${k && keys.length > 1 ? `<div class="group-label">${esc(k)}</div>` : ""}<ul class="list">${g.get(k).map(ckRow).join("")}</ul>`).join("");
}
function viewChecklist(){
  const items = all("check").sort((a,b) => (ckDone(a)?1:0)-(ckDone(b)?1:0) || (a.created||0)-(b.created||0));
  const routines = items.filter(isRoutine);
  const todayR = routines.filter(it => scheduledOn(it)), restR = routines.filter(it => !scheduledOn(it));
  const plain = items.filter(it => !isRoutine(it));
  const rDone = todayR.filter(ckDone).length, pDone = plain.filter(it => it.done).length;
  const groups = [...new Set(items.map(i => i.group).filter(Boolean))];
  return `<div class="bar"><h2>체크리스트</h2><span class="spacer"></span><button class="btn primary" data-act="newCheck">+ 항목 (상세 설정)</button></div>
  <div class="ck-layout">
    <div class="card panel">
      <div class="sect-title" style="margin-bottom:0">루틴 ${todayR.length ? `<span class="badge g">오늘 ${rDone}/${todayR.length}</span>` : ""}</div>
      ${todayR.length ? `<div class="progress"><i style="width:${todayR.length ? Math.round(rDone/todayR.length*100) : 0}%"></i></div>` : ""}
      ${todayR.length ? grouped(todayR) : `<div class="empty">오늘 할 루틴이 없어.</div>`}
      <form class="add" data-form="addCheck" data-repeat="1">
        <input name="t" data-keep="ck-routine" placeholder="+ 루틴 추가" autocomplete="off">
        <select name="r" aria-label="반복"><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select>
      </form>
      ${restR.length ? `<details class="rest"><summary>오늘은 쉬는 루틴 ${restR.length}개</summary>${grouped(restR)}</details>` : ""}
      <div class="muted" style="font-size:12px;margin-top:10px">매일 루틴은 날마다, 매주 루틴은 월요일에, 매월 루틴은 1일에 체크가 새로 풀려. 특정 요일만 하려면 항목을 눌러 요일을 골라줘.</div>
    </div>
    <div class="card panel">
      <div class="sect-title">체크리스트 ${plain.length ? `<span class="badge g">${pDone}/${plain.length}</span>` : ""}<span class="spacer"></span>${pDone ? `<button class="mini" data-act="clearDone">완료 항목 지우기</button>` : ""}</div>
      ${plain.length ? grouped(plain) : `<div class="empty">일정과 상관없는 할 일을 적어둬.</div>`}
      <form class="add" data-form="addCheck">
        <input name="t" data-keep="ck-plain" placeholder="+ 항목 추가" autocomplete="off">
      </form>
    </div>
  </div>
  <datalist id="groupList">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist>`;
}

/* ---------- timetable ---------- */
const TT_COLORS = ["#f7c6c5","#fcd9a8","#fbeaa0","#cdeac0","#bfe3e0","#c5d8f7","#d9cdf2","#f2c8e2","#e1d5c9","#d3d8de"];
const TT_DAYS = [1,2,3,4,5,6,0]; // 월..일
const DAY_KO = {"월":1,"화":2,"수":3,"목":4,"금":5,"토":6,"일":0};
const toMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60 + (m||0); };
const toHM = m => pad(Math.floor(m/60)) + ":" + pad(m%60);
const courses = () => all("course").sort((a,b) => (a.created||0)-(b.created||0));
function classesOn(ds){
  const dow = parse(ds).getDay(), out = [];
  for (const c of courses()) for (const sl of (c.slots||[])) if (sl.day === dow) out.push({id:c.id, ds, name:c.name, room:c.room, color:c.color, start:sl.start, end:sl.end});
  return out.sort((a,b) => toMin(a.start) - toMin(b.start));
}
const classRow = c => `<li class="ev ${classPast(c) ? "past" : ""}" data-act="editCourse" data-id="${c.id}"><span class="dot" style="background:${esc(c.color)}"></span><span class="time">${esc(c.start)}</span><span class="ttl">${esc(c.name)}</span><span class="cls">수업</span></li>`;

function viewTimetable(){
  const cs = courses();
  const slots = cs.flatMap(c => (c.slots||[]).map(sl => ({c, sl})));
  const days = TT_DAYS.filter(d => d >= 1 && d <= 5 || slots.some(x => x.sl.day === d));
  let startH = 9, endH = 18;
  for (const {sl} of slots) { startH = Math.min(startH, Math.floor(toMin(sl.start)/60)); endH = Math.max(endH, Math.ceil(toMin(sl.end)/60)); }
  const RH = 54, H = (endH - startH) * RH, todayDow = new Date().getDay();
  const lines = Array.from({length: endH - startH}, (_, i) => `<div class="tt-line" style="top:${i*RH}px"></div><div class="tt-line half" style="top:${i*RH + RH/2}px"></div>`).join("");
  const hours = Array.from({length: endH - startH}, (_, i) => `<span class="tt-hour" style="top:${i*RH + 3}px">${startH + i}</span>`).join("");
  const cols = days.map(d => {
    const blocks = slots.filter(x => x.sl.day === d).map(({c, sl}) => {
      const top = (toMin(sl.start) - startH*60) / 60 * RH, h = Math.max(18, (toMin(sl.end) - toMin(sl.start)) / 60 * RH);
      return `<div class="tt-block" data-act="editCourse" data-id="${c.id}" style="top:${top}px;height:${h-2}px;background:${esc(c.color||TT_COLORS[0])}"><b style="-webkit-line-clamp:${Math.max(1, Math.min(3, Math.floor((h - 8 - (c.room ? 13 : 0)) / 15)))}">${esc(c.name)}</b>${c.room ? `<span>${esc(c.room)}</span>` : ""}${h > 60 && c.prof ? `<span>${esc(c.prof)}</span>` : ""}</div>`;
    }).join("");
    return `<div class="tt-col ${d === todayDow ? "today" : ""}" data-act="ttNew" data-day="${d}" data-start="${startH}" data-rh="${RH}" style="height:${H}px">${lines}${blocks}</div>`;
  }).join("");
  return `<div class="bar"><h2>시간표</h2><span class="spacer"></span>
      <button class="btn" data-act="ttImport">이미지로 불러오기</button>
      <button class="btn primary" data-act="ttAdd">+ 수업</button></div>
    <div class="card tt-wrap">
      <div class="tt" style="grid-template-columns:34px repeat(${days.length},1fr)">
        <div class="tt-head"></div>${days.map(d => `<div class="tt-head">${WD[d]}</div>`).join("")}
        <div class="tt-hours" style="height:${H}px">${hours}</div>${cols}
      </div>
    </div>

/* 에브리타임 캡처 → Gemini로 인식 */
function downscale(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", 0.9).split(",")[1]);
    };
    img.onerror = () => rej(new Error("이미지를 읽지 못했어"));
    img.src = url;
  });
}
const TT_PROMPT = `이 이미지는 한국 대학생 시간표 앱 '에브리타임'의 시간표 캡처야.
가로축은 요일(월 화 수 목 금, 가끔 토 일), 세로축 왼쪽 숫자는 시각(9, 10, 11, 12, 1(=13시), 2(=14시) ... 오후 시각은 24시간제로 바꿔)이야.
각 색깔 칸이 수업 하나야. 칸 안에는 과목명, 그 아래 강의실(또는 교수명)이 적혀 있어.
칸의 위쪽 끝과 아래쪽 끝 위치를 세로축 눈금과 정확히 비교해서 시작·끝 시각을 5분 단위로 계산해.
같은 과목이 여러 요일에 있으면 slots에 모두 넣어. 과목명 글자는 이미지에 보이는 그대로 적어.
반드시 이 JSON 형식으로만 답해:
{"courses":[{"name":"과목명","room":"강의실 또는 빈 문자열","slots":[{"day":"월","start":"HH:MM","end":"HH:MM"}]}]}`;
async function recognizeTimetable(b64){
  if (!FBX || !FBX.app) throw new Error("로그인 후에 쓸 수 있어");
  const AI = await import(FB + "firebase-ai.js");
  const ai = AI.getAI(FBX.app, {backend: new AI.GoogleAIBackend()});
  let lastErr;
  for (const model of ["gemini-2.5-flash", "gemini-3-flash-preview", "gemini-2.5-flash-lite"]) {
    try {
      const m = AI.getGenerativeModel(ai, {model, generationConfig:{responseMimeType:"application/json", temperature:0}});
      const r = await m.generateContent([TT_PROMPT, {inlineData:{data:b64, mimeType:"image/jpeg"}}]);
      const txt = r.response.text().replace(/^```json|```$/g, "").trim();
      const data = JSON.parse(txt);
      return (data.courses || []).map(c => ({
        name: String(c.name||"").trim(), room: String(c.room||"").trim(),
        slots: (c.slots||[]).map(x => ({day: DAY_KO[x.day] ?? Number(x.day), start: String(x.start).slice(0,5), end: String(x.end).slice(0,5)}))
          .filter(x => x.day >= 0 && x.day <= 6 && /^\d\d:\d\d$/.test(x.start) && /^\d\d:\d\d$/.test(x.end) && toMin(x.end) > toMin(x.start))
      })).filter(c => c.name && c.slots.length);
    } catch (e) {
      lastErr = e; console.warn(model, e);
      if (!/not found|404|not supported|unavailable|NOT_FOUND/i.test(String(e && (e.message||e)))) break;
    }
  }
  throw lastErr;
}

function viewDesk(){
  const m = S.month, y = m.getFullYear(), mo = m.getMonth();
  const start = startOfWeek(new Date(y, mo, 1));
  const end = addDays(startOfWeek(new Date(y, mo+1, 0)), 6);
  let cells = "";
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {

  return `<div class="desk">

function render(){
  const t = new Date();
  document.getElementById("todayLabel").textContent = `${t.getFullYear()}년 ${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일`;
  const vis = visibleTabs();
  if (!vis.includes(S.view)) S.view = vis[0];
  document.getElementById("tabs").innerHTML = vis.map(k => `<a href="#${k}" data-v="${k}" class="${k === S.view ? "on" : ""}">${TAB_NAMES[k]}</a>`).join("");
  const view = document.getElementById("view");
  if (S.gate) { view.innerHTML = S.gate; return; }
  if (S.desk) { view.innerHTML = viewDesk(); return; }
  // keep focus / typed text across re-renders
  const ae = document.activeElement, keep = ae && ae.dataset && ae.dataset.keep;
  const kept = {};
  view.querySelectorAll("[data-keep]").forEach(el => { if (el.value) kept[el.dataset.keep] = el.value; });
  const sel = keep ? [ae.selectionStart, ae.selectionEnd] : null;
  view.innerHTML = S.view === "week" ? viewWeek() : S.view === "today" ? viewToday() : S.view === "checklist" ? viewChecklist() : S.view === "timetable" ? viewTimetable() : S.view === "presets" ? viewPresets() : viewMonth();
  view.querySelectorAll("[data-keep]").forEach(el => { if (kept[el.dataset.keep]) el.value = kept[el.dataset.keep]; });
  if (keep) { const el = view.querySelector(`[data-keep="${CSS.escape(keep)}"]`); if (el) { el.focus(); try { el.setSelectionRange(...sel); } catch(_){} } }
}

const TAB_NAMES = {month:"월간", week:"주간", today:"일간", checklist:"체크리스트", timetable:"시간표", presets:"프리셋"};
const TAB_KEYS = Object.keys(TAB_NAMES);
function tabConfig(){
  let cfg = (S.items.get("settings") || {}).tabs;
  if (!Array.isArray(cfg)) { try { cfg = JSON.parse(localStorage.getItem("planner-tabs") || "null"); } catch(_) { cfg = null; } }
  if (!Array.isArray(cfg)) cfg = [];
  cfg = cfg.filter(t => TAB_NAMES[t.k]).map(t => ({k:t.k, on:t.on !== false}));
  for (const k of TAB_KEYS) if (!cfg.some(t => t.k === k)) cfg.push({k, on:true});
  if (!cfg.some(t => t.on)) cfg[0].on = true;
  return cfg;
}
const monthPanelOn = () => (S.items.get("settings") || {}).monthPanel !== false;
const visibleTabs = () => tabConfig().filter(t => t.on).map(t => t.k);
function route(){
  const h = location.hash.replace("#",""), vis = visibleTabs();
  S.view = vis.includes(h) ? h : vis[0];
  render();
}
function saveSettings(patch){
  const cur = S.items.get("settings") || {};

}

document.addEventListener("click", e => {

document.getElementById("view").addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, ds = el.dataset.date;
  switch (a) {
    case "selDate": if (!monthPanelOn()) { S.day = ds; if (visibleTabs().includes("today")) { location.hash = "today"; } else eventModal(null, ds); break; }
      S.sel = ds; if (parse(ds).getMonth() !== S.month.getMonth()) S.month = new Date(parse(ds).getFullYear(), parse(ds).getMonth(), 1); render(); break;
    case "monthPrev": S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); render(); break;
    case "monthNext": S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); render(); break;
    case "monthToday": { const d = new Date(); S.month = new Date(d.getFullYear(), d.getMonth(), 1); S.sel = S.today; render(); break; }
    case "weekPrev": S.week = addDays(S.week, -7); render(); break;
    case "weekNext": S.week = addDays(S.week, 7); render(); break;
    case "weekToday": S.week = startOfWeek(new Date()); render(); break;
    case "dayPrev": S.day = ymd(addDays(parse(S.day), -1)); render(); break;
    case "dayNext": S.day = ymd(addDays(parse(S.day), 1)); render(); break;
    case "dayToday": S.day = S.today; render(); break;
    case "openDay": S.day = ds; location.hash = "today"; break;
    case "newEvent": eventModal(null, ds || S.today); break;
    case "editEvent": eventModal(id); break;
    case "editTask": taskModal(id); break;
    case "toggleTask": { const t = S.items.get(id); save(id, {...t, done: !t.done, doneAt: !t.done ? Date.now() : null}); break; }
    case "toTomorrow": {
      const t = S.items.get(id); const nd = ymd(addDays(parse(t.date < S.today ? S.today : t.date), 1));
      save(id, {...t, date: nd, origDate: t.origDate || t.date}); break;
    }
    case "toggleCheck": toggleCheck(id); break;
    case "editCheck": checkModal(id); break;
    case "newCheck": checkModal(null); break;
    case "showDayAnyway": S.showDayAnyway = S.today; render(); break;
    case "weekAdd": {
      S.weekAdd = S.weekAdd === ds ? null : ds; render();
      if (S.weekAdd) { const inp = document.querySelector(`[data-keep="task-${ds}"]`); if (inp) inp.focus(); }
      break;
    }
    case "deskDay": eventModal(null, ds); break;
    case "ttAdd": courseModal(null); break;
    case "newPreset": presetModal(null); break;
    case "editPreset": presetModal(id); break;
    case "usePreset": usePresetModal(id, ds || S.today); break;
    case "ttImport": importModal(); break;
    case "editCourse": e.stopPropagation(); courseModal(id); break;
    case "ttNew": {
      const r = el.getBoundingClientRect(), y = e.clientY - r.top;
      const m = Number(el.dataset.start)*60 + Math.floor(y / Number(el.dataset.rh) * 2) * 30;
      courseModal(null, {day:Number(el.dataset.day), start:toHM(m), end:toHM(m+75)}); break;
    }
    case "ttClear": {
      if (el.dataset.sure) courses().forEach(c => removeItem(c.id));
      else { el.dataset.sure = 1; el.textContent = "정말 다 지울까? 한 번 더 누르면 삭제"; }
      break;
    }
    case "clearDone": all("check").filter(it => !isRoutine(it) && it.done).forEach(it => removeItem(it.id)); break;
  }
});
document.getElementById("view").addEventListener("submit", e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const title = f.t.value.trim(); if (!title) return;
  f.t.value = "";
  if (f.dataset.form === "addTask") {
    const ds = f.dataset.date;
    if (ds < S.today) { setStatus("지난 날짜엔 할 일을 추가할 수 없어서 오늘로 넣었어."); }
    const d = ds < S.today ? S.today : ds;
    save(uid("td"), {kind:"task", title, date:d, origDate:d, done:false, created:Date.now()});
  } else if (f.dataset.form === "addCheck") {
    const repeat = f.dataset.repeat ? f.r.value : "none";
    save(uid("ck"), {kind:"check", title, group:"", repeat, days:[], history:[], doneKey:null, done:false, created:Date.now()});
  }
});

    let unsub = null;
    A.onAuthStateChanged(auth, u => {
      S.userName = u && u.displayName ? u.displayName.split(" ")[0] : "";
      if (unsub) { unsub(); unsub = null; }
      if (!u) {
        S.col = null; S.items = new Map(); S.rolled = false;
        S.gate = gate("로그인", "Google 계정으로 로그인하면 폰·노트북 어디서든 같은 일정이 보여.", ["login","Google로 로그인"]);
        setStatus(""); render(); return;
      }
      S.gate = null;
      setStatus("불러오는 중…");
      const colRef = F.collection(fs, "users", u.uid, "items");
      S.col = { doc: id => ({
        set: b => F.setDoc(F.doc(colRef, id), b),
        delete: () => F.deleteDoc(F.doc(colRef, id)),
      })};
      unsub = F.onSnapshot(colRef, {includeMetadataChanges: true}, snap => {
        S.items = new Map(snap.docs.map(d => [d.id, d.data()]));
        const st = S.items.get("settings");
        if (st && st.theme && st.theme !== document.documentElement.dataset.theme) applyTheme(st.theme);
        if (!snap.metadata.fromCache && !S.rolled) { S.rolled = true; rollover(); }
        setStatus(snap.metadata.fromCache ? "오프라인 · 연결되면 자동으로 동기화돼" : "");
        render();
      }, err => handleErr(err));
      render();
    });
  } catch (e) {
    console.error(e);
    S.gate = gate("불러오기 실패", "Firebase를 불러오지 못했어. 인터넷 연결이나 설정값을 확인해줘."); render();
  }
})();
async function doLogin(){
  try { await FBX.A.signInWithPopup(FBX.auth, new FBX.A.GoogleAuthProvider()); }
  catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) FBX.A.signInWithRedirect(FBX.auth, new FBX.A.GoogleAuthProvider());
    else if (e && e.code === "auth/popup-closed-by-user") {}
    else if (e && e.code === "auth/unauthorized-domain") setStatus("로그인 실패: Firebase 승인된 도메인에 이 주소가 등록되지 않았어.", true);
    else { console.error(e); setStatus("로그인 실패: " + (e.code || e.message), true); }
  }
}
</script>
